<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICKNPACK — Collections Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E4;
    --paper-raised:#FFFFFF;
    --ink:#1C2420;
    --muted:#6B6558;
    --line:#D8D0BC;
    --green:#1F4D3D;
    --green-dark:#12362A;
    --green-tint:#E4ECE6;
    --rust:#B5451F;
    --rust-tint:#F5E3DA;
    --gold:#B8892E;
    --gold-tint:#F3E9D2;
    --shadow: 0 1px 2px rgba(28,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%; overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  .num{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; white-space:nowrap;}
  #app{display:flex; height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px; flex-shrink:0;
    background:var(--green-dark);
    color:#EFEAD9;
    padding:22px 14px;
    display:flex; flex-direction:column;
    height:100vh; overflow-y:auto;
  }
  .brand{padding:0 8px 20px 8px; border-bottom:1px solid rgba(239,234,217,0.15); margin-bottom:16px;}
  .brand .mark{font-family:'Fraunces', serif; font-weight:700; font-size:19px; color:#fff; letter-spacing:0.2px;}
  .brand .sub{font-size:11.5px; color:#B9C4BC; margin-top:2px;}
  nav{display:flex; flex-direction:column; gap:2px;}
  .navitem{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; border-radius:5px; cursor:pointer;
    color:#D7DFD9; font-size:13.5px; font-weight:500;
    border-left:2px solid transparent;
    transition:background .12s ease;
  }
  .navlabel{display:flex; align-items:center; gap:10px;}
  .navitem svg{width:15px;height:15px; opacity:0.85; flex-shrink:0;}
  .navitem:hover{background:rgba(239,234,217,0.06);}
  .navitem.active{background:rgba(239,234,217,0.1); color:#fff; border-left:2px solid var(--gold);}
  .nav-badge{background:rgba(239,234,217,0.14); color:#D7DFD9; font-size:10.5px; padding:1px 7px; border-radius:9px; font-family:'IBM Plex Mono',monospace;}
  .nav-badge.alert{background:var(--rust); color:#fff;}
  .sidebar-foot{margin-top:auto; padding:10px 10px 0 10px; font-size:11px; color:#8A9891; border-top:1px solid rgba(239,234,217,0.12); padding-top:12px;}

  /* ---------- Main ---------- */
  main{flex:1; min-width:0; height:100vh; overflow-y:auto; padding:26px 34px 60px 34px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .topbar h1{font-size:22px; color:var(--green-dark);}
  .topbar .date{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .chip{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
    padding:8px 14px; display:flex; flex-direction:column; align-items:flex-end;
    box-shadow:var(--shadow);
  }
  .chip .label{font-size:10.5px; color:var(--muted); text-transform:none;}
  .chip .value{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; color:var(--rust);}

  /* ---------- Cards / stat grid ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
    padding:15px 16px; box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .stat-card .value{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; color:var(--green-dark);}
  .stat-card .value.rust{color:var(--rust);}
  .stat-card .foot{font-size:11px; color:var(--muted); margin-top:4px;}

  .panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;
  }
  .panel-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .panel-head h2{font-size:15.5px;}
  .panel-body{padding:0;}
  .panel-pad{padding:16px 18px;}

  /* ---------- Two-col dashboard layout ---------- */
  .dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-weight:500; color:var(--muted); font-size:11.5px;
    padding:9px 14px; border-bottom:1px solid var(--line); background:#FBF9F2; white-space:nowrap;
  }
  tbody td{padding:9px 14px; border-bottom:1px solid #ECE7D6; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF8EF;}
  td.right, th.right{text-align:right;}
  .cust-name{font-weight:500; color:var(--ink);}
  .inv-no{color:var(--green-dark); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .muted{color:var(--muted);}
  .small{font-size:11.5px;}

  .status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .status-overdue{color:var(--rust);} .status-overdue .status-dot{background:var(--rust);}
  .status-pending{color:var(--gold);} .status-pending .status-dot{background:var(--gold);}
  .status-cleared{color:#5C7A6C;} .status-cleared .status-dot{background:#5C7A6C;}

  .rowbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--line); background:#FBF9F2;}
  input[type=text], input[type=date], input[type=number], select{
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; padding:7px 10px;
    border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green); outline-offset:0; border-color:var(--green);}
  .search-wrap{position:relative; flex:1; min-width:220px;}
  .search-wrap input{width:100%;}
  .btn{
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:500;
    padding:7px 14px; border-radius:4px; border:1px solid var(--green-dark);
    background:var(--green-dark); color:#fff; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:var(--green);}
  .btn.ghost{background:transparent; color:var(--green-dark); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--green-tint);}
  .btn.small{padding:4px 10px; font-size:12px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .seg button{
    border:none; background:#fff; padding:7px 12px; font-size:12.5px; cursor:pointer;
    border-right:1px solid var(--line); color:var(--muted); font-family:'IBM Plex Sans',sans-serif;
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--green-dark); color:#fff;}

  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(28,36,32,0.45); display:none;
    align-items:flex-start; justify-content:center; padding-top:8vh; z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper-raised); border-radius:8px; width:520px; max-width:92vw;
    box-shadow:0 12px 32px rgba(28,36,32,0.25); border:1px solid var(--line);
  }
  .modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-size:16px;}
  .modal-close{cursor:pointer; color:var(--muted); font-size:18px; background:none; border:none;}
  .modal-body{padding:18px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select{width:100%;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  .inv-meta{background:var(--green-tint); border-radius:6px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; color:var(--green-dark);}
  .inv-meta .k{color:var(--muted); font-size:11px;}

  .autocomplete-list{
    position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line);
    border-top:none; border-radius:0 0 6px 6px; max-height:280px; overflow-y:auto; z-index:20;
    box-shadow:0 6px 16px rgba(28,36,32,0.12);
  }
  .autocomplete-item{padding:9px 12px; cursor:pointer; border-bottom:1px solid #F0EBDB; font-size:12.5px;}
  .autocomplete-item:hover{background:var(--paper);}
  .autocomplete-item .an{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--green-dark);}
  .autocomplete-item .ac{color:var(--muted); font-size:11.5px;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--green-dark); color:#fff;
    padding:11px 18px; border-radius:6px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,0.2);
    opacity:0; transform:translateY(8px); transition:all .25s ease; z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .expand-row td{background:#FBF9F2; padding:0;}
  .expand-inner{padding:6px 18px 12px 32px;}
  .expand-inner table{background:transparent;}
  .chev{display:inline-block; transition:transform .15s; margin-right:6px; color:var(--muted);}
  .chev.open{transform:rotate(90deg);}
  .clickable{cursor:pointer;}

  /* ---------- Insight bars (ageing / dashboard) ---------- */
  .insight-row{display:grid; grid-template-columns:170px 1fr auto; align-items:center; gap:16px; padding:9px 0; border-bottom:1px solid #F0EBDB;}
  .insight-row:last-child{border-bottom:none;}
  .insight-label{font-size:12.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .risk-tag{font-size:10px; padding:2px 7px; border-radius:8px; font-weight:600; white-space:nowrap;}
  .insight-bar-track{height:8px; background:#EFEAD8; border-radius:5px; overflow:hidden;}
  .insight-bar-fill{height:100%; border-radius:5px; transition:width .3s ease;}
  .insight-val{font-size:12.5px; text-align:right;}
  .insight-val .amt{font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap; display:block;}
  .insight-val .sub{color:var(--muted); font-size:11px; white-space:nowrap;}

  /* ---------- Mini bar chart (dashboard trend) ---------- */
  .mini-chart{display:flex; align-items:flex-end; gap:4px; height:90px; padding:0 2px;}
  .mini-bar-wrap{flex:1; height:100%; display:flex; align-items:flex-end; cursor:default;}
  .mini-bar{width:100%; background:var(--green); border-radius:3px 3px 0 0; min-height:2px; transition:height .3s ease;}
  .mini-bar-wrap:hover .mini-bar{background:var(--gold);}
  .mini-chart-labels{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:4px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

  td, th{overflow-wrap:break-word; word-break:break-word;}

  @media (max-width: 880px){
    #app{flex-direction:column; height:auto; overflow:visible;}
    html,body{overflow:auto;}
    .sidebar{width:100%; flex-direction:row; align-items:center; overflow-x:auto; overflow-y:visible; height:auto;}
    .brand{border-bottom:none; padding:0 12px 0 0; margin-bottom:0;}
    nav{flex-direction:row;}
    main{padding:18px; height:auto; overflow:visible;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr;}
    .insight-row{grid-template-columns:1fr; gap:4px;}
    .insight-val{text-align:left;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalRoot"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const INVOICES_RAW = [];
</script>
<script>
// ============================================================
// PICKNPACK Collections Register — app logic
// ============================================================

// Agar ye app Claude ke bahar (apni website pe) chal raha hai, to window.storage
// nahi hoga — us case me localStorage ka istemaal karte hain taaki app crash na ho.
if (!window.storage) {
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem('cr_' + key);
      if (raw === null) throw new Error('not found');
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem('cr_' + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem('cr_' + key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('cr_' + (prefix || ''))) keys.push(k.slice(3));
      }
      return { keys, prefix };
    }
  };
}

const LS_CONFIG = 'collections:config';
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);

const state = {
  view: 'dashboard',
  invoicesMaster: [],
  entries: [],
  followups: [],
  config: { sheetsUrl: '' },
  loaded: false,
  search: '',
  statusFilter: 'open',
  locationFilter: 'all',
  custSearch: '',
  followupFilter: 'today',
  logFrom: '',
  logTo: '',
  logCust: '',
  misPeriod: 'today',
  settingsUnlocked: false,
  archived: [],
  modal: null,
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtMoney(n) {
  const v = Math.round((n || 0) * 100) / 100;
  return v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function addDays(dateStr, n) { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

// ---------------- Backend abstraction (local browser storage OR Google Sheets) ----------------
async function loadConfig() {
  try {
    const res = await window.storage.get(LS_CONFIG, true);
    state.config = res && res.value ? JSON.parse(res.value) : { sheetsUrl: '' };
  } catch (e) { state.config = { sheetsUrl: '' }; }
}
async function saveConfig() { await window.storage.set(LS_CONFIG, JSON.stringify(state.config), true); }
function usingSheets() { return !!(state.config.sheetsUrl && state.config.sheetsUrl.trim()); }

async function backendGet(sheetName, localKey, fallback) {
  if (usingSheets()) {
    try {
      const url = state.config.sheetsUrl.trim() + (state.config.sheetsUrl.includes('?') ? '&' : '?') + 'sheet=' + encodeURIComponent(sheetName);
      const res = await fetch(url);
      const data = await res.json();
      return Array.isArray(data) ? data : fallback;
    } catch (e) { showToast('Google Sheet se data nahi mil paya — local data use kar rahe hain'); }
  }
  try {
    const res = await window.storage.get(localKey, true);
    return res && res.value ? JSON.parse(res.value) : fallback;
  } catch (e) { return fallback; }
}
async function backendReplace(sheetName, localKey, rows) {
  if (usingSheets()) {
    try {
      await fetch(state.config.sheetsUrl.trim(), { method: 'POST', body: JSON.stringify({ sheet: sheetName, action: 'replace', rows }) });
    } catch (e) { showToast('Google Sheet me save nahi ho paya, dubara try karein'); }
  }
  try { await window.storage.set(localKey, JSON.stringify(rows), true); } catch (e) { /* ignore */ }
}
async function persistInvoices() { await backendReplace('InvoicesMaster', 'collections:invoices', state.invoicesMaster); }
async function persistEntries() { await backendReplace('Entries', 'collections:entries', state.entries); }
async function persistFollowups() { await backendReplace('Followups', 'collections:followups', state.followups); }
async function persistArchived() { await backendReplace('Archived', 'collections:archived', state.archived); }

async function loadAll() {
  await loadConfig();
  const [inv, entr, fu, arc] = await Promise.all([
    backendGet('InvoicesMaster', 'collections:invoices', []),
    backendGet('Entries', 'collections:entries', []),
    backendGet('Followups', 'collections:followups', []),
    backendGet('Archived', 'collections:archived', []),
  ]);
  state.invoicesMaster = inv || [];
  state.entries = entr || [];
  state.followups = fu || [];
  state.archived = arc || [];
  state.loaded = true;
}

async function resetAllData() {
  state.invoicesMaster = [];
  state.entries = [];
  state.followups = [];
  state.archived = [];
  await Promise.all([persistInvoices(), persistEntries(), persistFollowups(), persistArchived()]);
}

// ---------------- Derived data ----------------
function computeEnriched() {
  const collectedByKey = {};
  for (const e of state.entries) {
    const key = e.invId || e.invNo;
    collectedByKey[key] = (collectedByKey[key] || 0) + Number(e.amount);
  }
  return state.invoicesMaster.map(inv => {
    const key = inv.invId || inv.invNo;
    const collected = Math.round(((collectedByKey[key] || 0)) * 100) / 100;
    const outstanding = Math.max(0, Math.round((inv.balance - collected) * 100) / 100);
    const due = new Date(inv.dueDate);
    const overdueDays = Math.floor((TODAY - due) / (1000 * 60 * 60 * 24));
    let status = 'cleared';
    if (outstanding > 0.5) status = overdueDays > 0 ? 'overdue' : 'pending';
    return { ...inv, collected, outstanding, overdueDays: outstanding > 0.5 ? Math.max(0, overdueDays) : 0, status, location: inv.location || '' };
  });
}
function aggregateCustomers(enriched) {
  const map = {};
  for (const inv of enriched) {
    if (!map[inv.cust]) map[inv.cust] = { cust: inv.cust, count: 0, total: 0, collected: 0, outstanding: 0, maxOverdue: 0, phone: '', email: '', location: '', invoices: [] };
    const c = map[inv.cust];
    c.count++; c.total += inv.total; c.collected += inv.collected; c.outstanding += inv.outstanding;
    c.maxOverdue = Math.max(c.maxOverdue, inv.overdueDays);
    if (!c.phone && inv.phone) c.phone = inv.phone;
    if (!c.email && inv.email) c.email = inv.email;
    if (!c.location && inv.location) c.location = inv.location;
    c.invoices.push(inv);
  }
  return Object.values(map).sort((a, b) => b.outstanding - a.outstanding);
}
function aggregateLocations(enriched) {
  const map = {};
  for (const inv of enriched) {
    const loc = inv.location && inv.location.trim() ? inv.location.trim() : 'Location not set';
    if (!map[loc]) map[loc] = { location: loc, count: 0, outstanding: 0, overdueAmt: 0, overdueCount: 0, customers: new Set() };
    const l = map[loc];
    l.count++; l.outstanding += inv.outstanding; l.customers.add(inv.cust);
    if (inv.status === 'overdue') { l.overdueAmt += inv.outstanding; l.overdueCount++; }
  }
  return Object.values(map).map(l => ({ ...l, customerCount: l.customers.size })).sort((a, b) => b.outstanding - a.outstanding);
}
function agingBuckets(enriched) {
  const buckets = [
    { label: '0–15 Days', min: 0, max: 15, risk: 'Low', color: '#3f8f5f' },
    { label: '16–30 Days', min: 16, max: 30, risk: 'Medium', color: '#b8892e' },
    { label: '31–45 Days', min: 31, max: 45, risk: 'High', color: '#c8722f' },
    { label: '46–60 Days', min: 46, max: 60, risk: 'Critical', color: '#b5451f' },
    { label: '60+ Days', min: 61, max: Infinity, risk: 'Severe', color: '#8a2f18' },
  ];
  const open = enriched.filter(i => i.outstanding > 0.5 && i.overdueDays > 0);
  const totalOutstanding = open.reduce((s, i) => s + i.outstanding, 0) || 1;
  return buckets.map(b => {
    const items = open.filter(i => i.overdueDays >= b.min && i.overdueDays <= b.max);
    const amount = items.reduce((s, i) => s + i.outstanding, 0);
    const custSet = new Set(items.map(i => i.cust));
    return { ...b, invoiceCount: items.length, customerCount: custSet.size, amount, pct: (amount / totalOutstanding) * 100 };
  });
}
function dashboardStats(enriched) {
  const totalOutstanding = enriched.reduce((s, i) => s + i.outstanding, 0);
  const overdueAmt = enriched.filter(i => i.status === 'overdue').reduce((s, i) => s + i.outstanding, 0);
  const openCount = enriched.filter(i => i.outstanding > 0.5).length;
  const overdueCount = enriched.filter(i => i.status === 'overdue').length;
  const custOutstanding = new Set(enriched.filter(i => i.outstanding > 0.5).map(i => i.cust)).size;
  const ts = todayStr();
  const collectedToday = state.entries.filter(e => e.date === ts).reduce((s, e) => s + Number(e.amount), 0);
  const monthPrefix = ts.slice(0, 7);
  const collectedMonth = state.entries.filter(e => e.date && e.date.slice(0, 7) === monthPrefix).reduce((s, e) => s + Number(e.amount), 0);
  return { totalOutstanding, overdueAmt, openCount, overdueCount, custOutstanding, collectedToday, collectedMonth };
}
function last14DaysCollections() {
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(todayStr(), -i));
  return days.map(d => ({
    date: d,
    amount: state.entries.filter(e => e.date === d).reduce((s, e) => s + Number(e.amount), 0)
  }));
}
function followupIndex() {
  const map = {};
  for (const f of state.followups) {
    const cur = map[f.cust];
    const key = (f.date || '') + '|' + (f.createdAt || '');
    if (!cur || key > cur._key) map[f.cust] = { ...f, _key: key };
  }
  return map;
}
function lastPaymentIndex() {
  const map = {};
  for (const e of state.entries) {
    const cur = map[e.cust];
    const key = (e.date || '') + '|' + (e.createdAt || '');
    if (!cur || key > cur._key) map[e.cust] = { ...e, _key: key };
  }
  return map;
}
function followupTasks(enriched) {
  const fu = followupIndex();
  const custs = aggregateCustomers(enriched);
  const custMap = {}; custs.forEach(c => custMap[c.cust] = c);
  const tasks = [];
  for (const cust in fu) {
    const f = fu[cust];
    if (!f.nextDate) continue;
    tasks.push({ cust, nextDate: f.nextDate, lastNote: f.note, lastFollowupDate: f.date, outstanding: custMap[cust] ? custMap[cust].outstanding : 0 });
  }
  return tasks.sort((a, b) => a.nextDate.localeCompare(b.nextDate));
}
function customerTimeline(cust) {
  const payItems = state.entries.filter(e => e.cust === cust).map(e => ({ kind: 'payment', date: e.date, amount: Number(e.amount), invNo: e.invNo, mode: e.mode, note: e.note, sortKey: (e.date || '') + '|' + (e.createdAt || '') }));
  const fuItems = state.followups.filter(f => f.cust === cust).map(f => ({ kind: 'followup', date: f.date, note: f.note, nextDate: f.nextDate, sortKey: (f.date || '') + '|' + (f.createdAt || '') }));
  return [...payItems, ...fuItems].sort((a, b) => b.sortKey.localeCompare(a.sortKey));
}
function periodRange(period) {
  const ts = todayStr();
  if (period === 'today') return { from: ts, to: ts, label: 'Aaj' };
  if (period === 'week') return { from: addDays(ts, -6), to: ts, label: 'Pichhle 7 din' };
  return { from: ts.slice(0, 8) + '01', to: ts, label: 'Is mahine' };
}
function misReport(enriched, period) {
  const { from, to, label } = periodRange(period);
  const entriesInPeriod = state.entries.filter(e => e.date >= from && e.date <= to);
  const collected = entriesInPeriod.reduce((s, e) => s + Number(e.amount), 0);
  const invoicesTouched = new Set(entriesInPeriod.map(e => e.invId || e.invNo)).size;
  const closingOutstanding = enriched.reduce((s, i) => s + i.outstanding, 0);
  const openingOutstanding = closingOutstanding + collected;
  const efficiency = openingOutstanding > 0 ? (collected / openingOutstanding) * 100 : 0;
  const modeBreakdown = {};
  entriesInPeriod.forEach(e => { modeBreakdown[e.mode || 'Other'] = (modeBreakdown[e.mode || 'Other'] || 0) + Number(e.amount); });
  return { from, to, label, collected, invoicesTouched, closingOutstanding, openingOutstanding, efficiency, modeBreakdown, entriesInPeriod };
}

// Refocus helper: after a full render(), the old DOM node references go stale.

}

// ---------------- Archive ----------------
function archiveClearedInvoices(enriched) {
  const cleared = enriched.filter(i => i.status === 'cleared');
  if (!cleared.length) { showToast('Koi cleared invoice nahi mili'); return; }
  if (!confirm(`${cleared.length} cleared invoices ko archive karna hai? Ye Invoices list se hat jayengi.`)) return;
  const clearedKeys = new Set(cleared.map(i => (i.invId || i.invNo)));
  state.archived = state.archived.concat(cleared.map(i => ({ ...i, archivedAt: new Date().toISOString() })));
  state.invoicesMaster = state.invoicesMaster.filter(inv => !clearedKeys.has(inv.invId || inv.invNo));
  persistInvoices(); persistArchived();
  render();
  showToast(`${cleared.length} invoices archive ho gayi`);
}
function restoreArchived(key) {
  const item = state.archived.find(i => (i.invId || i.invNo) === key);
  if (!item) return;
  state.archived = state.archived.filter(i => (i.invId || i.invNo) !== key);
  const { collected, outstanding, overdueDays, status, archivedAt, ...original } = item;
  state.invoicesMaster.push(original);
  persistInvoices(); persistArchived();
  render();
  showToast('Invoice wapis Invoices list me aa gayi');
}
function renderArchived(main) {
  const rows = [...state.archived].sort((a, b) => (b.archivedAt || '').localeCompare(a.archivedAt || ''));
  main.innerHTML = `

// ---------------- Follow-ups (task window) ----------------
function renderFollowups(main, enriched) {
  const all = followupTasks(enriched);
  const ts = todayStr();
  const tomorrow = addDays(ts, 1);
  const weekEnd = addDays(ts, 6);
  let rows = all;
  if (state.followupFilter === 'today') rows = all.filter(t => t.nextDate === ts);
  else if (state.followupFilter === 'tomorrow') rows = all.filter(t => t.nextDate === tomorrow);
  else if (state.followupFilter === 'week') rows = all.filter(t => t.nextDate >= ts && t.nextDate <= weekEnd);
  else if (state.followupFilter === 'overdue') rows = all.filter(t => t.nextDate < ts);
  const counts = {
    today: all.filter(t => t.nextDate === ts).length,
    tomorrow: all.filter(t => t.nextDate === tomorrow).length,
    week: all.filter(t => t.nextDate >= ts && t.nextDate <= weekEnd).length,
    overdue: all.filter(t => t.nextDate < ts).length,
    all: all.length,
  };
  main.innerHTML = `
    ${pageHeader('Follow-ups')}
    <div class="panel">
      <div class="rowbar">
        <div class="seg" id="fuSeg">
          <button data-f="today" class="${state.followupFilter === 'today' ? 'active' : ''}">Today (${counts.today})</button>
          <button data-f="tomorrow" class="${state.followupFilter === 'tomorrow' ? 'active' : ''}">Tomorrow (${counts.tomorrow})</button>
          <button data-f="week" class="${state.followupFilter === 'week' ? 'active' : ''}">This week (${counts.week})</button>
          <button data-f="overdue" class="${state.followupFilter === 'overdue' ? 'active' : ''}">Overdue (${counts.overdue})</button>
          <button data-f="all" class="${state.followupFilter === 'all' ? 'active' : ''}">All (${counts.all})</button>
        </div>
        <span class="small muted" style="margin-left:auto">${rows.length} to work on</span>
      </div>
      <div class="panel-body" style="max-height:66vh; overflow:auto;">
        <table>
          <thead><tr><th>Next follow-up</th><th>Customer</th><th class="right">Outstanding</th><th>Last note</th><th></th></tr></thead>
          <tbody>${rows.length ? rows.map(t => `
            <tr>
              <td class="${t.nextDate < ts ? 'status-overdue' : 'muted'} small">${fmtDate(t.nextDate)}${t.nextDate < ts ? ' · overdue' : ''}</td>
              <td class="cust-name">${escapeHtml(t.cust)}</td>

        <div class="field" style="flex:1"><label>Mode</label><select id="entryMode">

        </select></div>

      <div class="field"><label>Reference / note (optional)</label><input type="text" id="entryNote" placeholder="UTR / cheque no. / remarks"></div>
      <button class="btn" id="entrySubmit" style="width:100%">Record collection</button>

    selWrap.querySelector('#entrySubmit').addEventListener('click', () => {
      const amt = parseFloat(selWrap.querySelector('#entryAmount').value);

      `<tr><td colspan="7" class="empty">No collection entries match these filters.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
  main.querySelector('#logFrom').addEventListener('change', (e) => { state.logFrom = e.target.value; render(); });
  main.querySelector('#logTo').addEventListener('change', (e) => { state.logTo = e.target.value; render(); });
  const logCustEl = main.querySelector('#logCust');
  logCustEl.addEventListener('input', () => { state.logCust = logCustEl.value; render(); refocusInput('logCust'); });
  main.querySelector('#logClear').addEventListener('click', () => { state.logFrom = ''; state.logTo = ''; state.logCust = ''; render(); });
  main.querySelectorAll('[data-undo]').forEach(b => { b.addEventListener('click', () => { removeEntry(b.dataset.undo); render(); showToast('Entry removed'); }); });
  main.querySelector('#logExport').addEventListener('click', () => { exportCsv(rows); });
}
function exportCsv(rows) {
  const header = ['Date', 'Invoice', 'Customer', 'Amount', 'Mode', 'Note'];
  const lines = [header.join(',')];
  for (const e of rows) {
    const line = [e.date, e.invNo, e.cust, e.amount, e.mode, (e.note || '')].map(v => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
    lines.push(line);
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'collection-log.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        <div class="field"><label>Google Apps Script Web App URL</label>
          <input type="text" id="sheetsUrl" placeholder="https://script.google.com/macros/s/XXXX/exec" value="${escapeHtml(state.config.sheetsUrl || '')}">
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="btnSaveUrl">Save & reload data</button>
          <button class="btn ghost" id="btnTestUrl">Test connection</button>
          <button class="btn ghost" id="btnClearUrl">Use local storage instead</button>
        </div>
        <div id="settingsMsg" class="small" style="margin-top:10px;"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Import invoice data</h2></div>
      <div class="panel-pad">
        <p class="muted small" style="max-width:640px;">Export your invoice report from Zoho as .xlsx and import it here anytime to refresh
        outstanding figures. Collection entries and follow-ups are matched by invoice number/ID, so nothing is lost.</p>
        <button class="btn" id="btnImport2">Import Excel file</button>
        <input type="file" id="importFile2" accept=".xlsx,.xls" style="display:none">
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 style="color:var(--rust)">Reset all data</h2></div>
      <div class="panel-pad">
        <p class="muted small" style="max-width:640px;">Ye saari invoices, collection entries, aur follow-ups mita dega (jahan bhi store hain — is device pe ya connected Google Sheet me), taaki tum bilkul fresh start kar sako. Ye undo nahi ho sakta.</p>
        <button class="btn ghost small" id="btnReset" style="border-color:var(--rust); color:var(--rust)">Reset all data</button>
      </div>
    </div>
    <div style="text-align:right;"><span class="small muted clickable" id="btnLockAgain">Lock settings again</span></div>
  `;
  const msg = main.querySelector('#settingsMsg');
  main.querySelector('#btnSaveUrl').addEventListener('click', async () => {
    state.config.sheetsUrl = main.querySelector('#sheetsUrl').value.trim();
    await saveConfig();
    msg.textContent = 'Saved. Reloading data from the configured backend…';
    await loadAll();
    render();
    showToast(usingSheets() ? 'Ab Google Sheet se connected hai' : 'Local storage use ho raha hai');
  });
  main.querySelector('#btnClearUrl').addEventListener('click', async () => {
    state.config.sheetsUrl = '';
    await saveConfig();
    main.querySelector('#sheetsUrl').value = '';
    await loadAll();
    render();
    showToast('Local storage use ho raha hai ab');
  });
  main.querySelector('#btnTestUrl').addEventListener('click', async () => {
    const url = main.querySelector('#sheetsUrl').value.trim();
    if (!url) { msg.textContent = 'URL daaliye pehle.'; return; }
    msg.textContent = 'Testing…';
    try {
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'sheet=Entries');
      const data = await res.json();
      msg.textContent = Array.isArray(data) ? `Connection OK — ${data.length} rows mile.` : 'Connected, but response unexpected.';
    } catch (e) { msg.textContent = 'Connect nahi ho paya. URL check karein aur "Anyone" access confirm karein.'; }
  });
  const importBtn2 = main.querySelector('#btnImport2');
  const importFile2 = main.querySelector('#importFile2');
  importBtn2.addEventListener('click', () => importFile2.click());
  importFile2.addEventListener('change', (ev) => { if (ev.target.files[0]) handleExcelImport(ev.target.files[0]); });
  main.querySelector('#btnReset').addEventListener('click', async () => {
    if (!confirm('Pakka? Ye saari invoices, entries aur follow-ups hamesha ke liye mita dega.')) return;
    await resetAllData();
    render();
    showToast('Sab data reset ho gaya — ab fresh Excel import karo');
  });
  main.querySelector('#btnLockAgain').addEventListener('click', () => { state.settingsUnlocked = false; render(); });
}

// ---------------- Excel import ----------------
function normKey(k) { return String(k || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function pickField(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) { const found = keys.find(k => normKey(k) === cand); if (found !== undefined) return row[found]; }
  for (const cand of candidates) { const found = keys.find(k => normKey(k).includes(cand)); if (found !== undefined) return row[found]; }
  return undefined;
}
function toDateStr(v) {
  if (!v) return '';
  if (v instanceof Date) return isNaN(v) ? '' : v.toISOString().slice(0, 10);
  const d = new Date(v);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function toNum(v) {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v || '').replace(/[,₹\s]/g, ''));
  return isNaN(n) ? 0 : n;
}
const EXCLUDED_LOCATIONS = ['delhi- online', 'delhi-online', 'delhi online'];
function handleExcelImport(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const wsName = wb.SheetNames[0];
      const ws = wb.Sheets[wsName];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { showToast('File khaali lagti hai'); return; }
      const seen = new Map();
      let skippedExcluded = 0;
      for (const row of json) {
        const invNoRaw = pickField(row, ['invoice number', 'invoice no', 'invoice #']);
        if (!invNoRaw) continue;
        const invNo = String(invNoRaw).trim();
        const invIdRaw = pickField(row, ['invoice id', 'invoiceid']);
        const invId = invIdRaw ? String(invIdRaw).trim() : '';
        const location = String(pickField(row, ['location name', 'branch name', 'location']) || '').trim();
        const normLoc = location.toLowerCase().replace(/\s+/g, ' ').trim();
        if (EXCLUDED_LOCATIONS.includes(normLoc)) { skippedExcluded++; continue; }
        const dedupeKey = (invId || invNo).toLowerCase();
        if (seen.has(dedupeKey)) continue;
        seen.set(dedupeKey, {
          invId,
          invNo: String(invNo).trim(),
          cust: String(pickField(row, ['customer name', 'customer']) || '').trim(),
          phone: String(pickField(row, ['primary contact phone', 'phone']) || '').trim(),
          email: String(pickField(row, ['primary contact emailid', 'email', 'email id']) || '').trim(),
          invDate: toDateStr(pickField(row, ['invoice date'])),
          dueDate: toDateStr(pickField(row, ['due date'])),
          total: Math.round(toNum(pickField(row, ['total'])) * 100) / 100,
          balance: Math.round(toNum(pickField(row, ['balance'])) * 100) / 100,
          location,
        });
      }
      const newList = Array.from(seen.values());
      if (!newList.length) { showToast('Koi valid invoice row nahi mili — columns check karein'); return; }
      state.invoicesMaster = newList;
      persistInvoices();
      render();
      const custCount = new Set(newList.map(i => i.cust)).size;
      showToast(`${newList.length} invoices, ${custCount} customers import ho gaye${skippedExcluded ? ` (${skippedExcluded} Delhi- Online skip ki gayi)` : ''}`);
    } catch (err) { showToast('File padhne me error aaya — sahi .xlsx file check karein'); }
  };
  reader.readAsArrayBuffer(file);
}

// ---------------- Entry / follow-up mutation ----------------
function addEntry(invNo, cust, amount, date, mode, note, invId) {
  state.entries.push({ id: uid(), invId: invId || '', invNo, cust, amount: Math.round(amount * 100) / 100, date, mode, note, createdAt: new Date().toISOString() });
  persistEntries();
}
function removeEntry(id) { state.entries = state.entries.filter(e => e.id !== id); persistEntries(); }
function addFollowup(cust, date, note, nextDate) {
  state.followups.push({ id: uid(), cust, date, note, nextDate, createdAt: new Date().toISOString() });
  persistFollowups();
}

// ---------------- Modal ----------------
function openModal(modalSpec) {
  state.modal = modalSpec;
  renderModal(computeEnriched());
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() {
  state.modal = null;
  document.getElementById('modalBackdrop').classList.remove('open');
}
function renderModal(enriched) {
  const backdrop = document.getElementById('modalBackdrop');
  const root = document.getElementById('modalRoot');
  if (!state.modal) { root.innerHTML = ''; return; }

  if (state.modal.type === 'record') {
    const inv = enriched.find(i => i.invNo === state.modal.invNo);
    if (!inv) { closeModal(); return; }
    root.innerHTML = `
      <div class="modal-head"><h3>Record collection</h3><button class="modal-close" id="mClose">✕</button></div>
      <div class="modal-body">
        <div class="inv-meta">
          <div><span class="k">Invoice</span><br><b>${escapeHtml(inv.invNo)}</b> — ${escapeHtml(inv.cust)}</div>
          <div style="margin-top:6px; display:flex; gap:18px;">
            <div><span class="k">Total</span><br>₹${fmtMoney(inv.total)}</div>
            <div><span class="k">Outstanding</span><br><b>₹${fmtMoney(inv.outstanding)}</b></div>
          </div>
        </div>
        <div class="field"><label>Amount received (₹)</label><input type="number" id="mAmount" min="0" step="0.01" value="${inv.outstanding}"></div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1"><label>Date</label><input type="date" id="mDate" value="${todayStr()}"></div>
          <div class="field" style="flex:1"><label>Mode</label><select id="mMode"><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Cash</option><option>Other</option></select></div>
        </div>
        <div class="field"><label>Reference / note (optional)</label><input type="text" id="mNote" placeholder="UTR / cheque no. / remarks"></div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn" id="mSubmit">Record collection</button></div>
    `;
    root.querySelector('#mClose').addEventListener('click', closeModal);
    root.querySelector('#mCancel').addEventListener('click', closeModal);
    root.querySelector('#mSubmit').addEventListener('click', () => {
      const amt = parseFloat(root.querySelector('#mAmount').value);
      const date = root.querySelector('#mDate').value || todayStr();
      const mode = root.querySelector('#mMode').value;
      const note = root.querySelector('#mNote').value.trim();
      if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
      addEntry(inv.invNo, inv.cust, amt, date, mode, note, inv.invId);
      closeModal(); render();
      showToast(`Recorded ₹${fmtMoney(amt)} against ${inv.invNo}`);
    });
    backdrop.onclick = (ev) => { if (ev.target === backdrop) closeModal(); };
    return;
  }

  if (state.modal.type === 'profile') {
    const cust = state.modal.cust;
    const custRow = aggregateCustomers(enriched).find(c => c.cust === cust);
    const timeline = customerTimeline(cust);
    const openInvoices = custRow ? custRow.invoices.filter(i => i.outstanding > 0.5).sort((a, b) => b.outstanding - a.outstanding) : [];
    root.innerHTML = `
      <div class="modal-head"><h3>${escapeHtml(cust)}</h3><button class="modal-close" id="mClose">✕</button></div>
      <div class="modal-body" style="max-height:72vh; overflow:auto;">
        <div class="inv-meta">
          <div style="display:flex; gap:18px; flex-wrap:wrap;">
            <div><span class="k">Invoices</span><br>${custRow ? custRow.count : 0}</div>
            <div><span class="k">Outstanding</span><br><b>₹${fmtMoney(custRow ? custRow.outstanding : 0)}</b></div>
            <div><span class="k">Oldest overdue</span><br>${custRow && custRow.maxOverdue > 0 ? custRow.maxOverdue + ' days' : '—'}</div>
            ${custRow && custRow.location ? `<div><span class="k">Location</span><br>${escapeHtml(custRow.location)}</div>` : ''}
          </div>
        </div>

        ${openInvoices.length ? `
        <div style="font-weight:600; font-size:13px; margin:14px 0 8px;">Open invoices</div>
        <table style="margin-bottom:14px;">
          <thead><tr><th>Invoice</th><th>Due date</th><th class="right">Outstanding</th><th></th></tr></thead>
          <tbody>${openInvoices.map(i => `
            <tr><td class="inv-no">${escapeHtml(i.invNo)}</td><td class="muted small">${fmtDate(i.dueDate)}</td>
            <td class="right num" style="font-weight:600">₹${fmtMoney(i.outstanding)}</td>
            <td><button class="btn small" data-record="${escapeHtml(i.invNo)}">Record</button></td></tr>`).join('')}</tbody>
        </table>` : ''}

        <div style="font-weight:600; font-size:13px; margin-bottom:8px;">Add a follow-up</div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1"><label>Date</label><input type="date" id="fuDate" value="${todayStr()}"></div>
          <div class="field" style="flex:1"><label>Next follow-up (optional)</label><input type="date" id="fuNext"></div>
        </div>
        <div class="field"><label>Note</label><input type="text" id="fuNote" placeholder="e.g. Called — promised payment by Friday"></div>
        <button class="btn" id="fuSubmit" style="width:100%; margin-bottom:16px;">Save follow-up</button>

        <div style="font-weight:600; font-size:13px; margin-bottom:8px;">Timeline</div>
        <div>
          ${timeline.length ? timeline.map(t => {
      if (t.kind === 'payment') {
        return `<div style="border-left:2px solid var(--green); padding:4px 0 10px 12px; margin-bottom:2px;">
                <div class="small muted">${fmtDate(t.date)} · Payment</div>
                <div><b>₹${fmtMoney(t.amount)}</b> received against <span class="inv-no">${escapeHtml(t.invNo)}</span> (${escapeHtml(t.mode)})</div>
                ${t.note ? `<div class="small muted">${escapeHtml(t.note)}</div>` : ''}
              </div>`;
      }
      return `<div style="border-left:2px solid var(--gold); padding:4px 0 10px 12px; margin-bottom:2px;">
              <div class="small muted">${fmtDate(t.date)} · Follow-up</div>
              <div>${escapeHtml(t.note)}</div>
              ${t.nextDate ? `<div class="small muted">Next follow-up: ${fmtDate(t.nextDate)}</div>` : ''}
            </div>`;
    }).join('') : `<div class="empty">No follow-ups or payments recorded yet for this customer.</div>`}
        </div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Close</button></div>
    `;
    root.querySelector('#mClose').addEventListener('click', closeModal);
    root.querySelector('#mCancel').addEventListener('click', closeModal);
    root.querySelectorAll('[data-record]').forEach(b => {
      b.addEventListener('click', () => { openModal({ type: 'record', invNo: b.dataset.record }); });
    });
    root.querySelector('#fuSubmit').addEventListener('click', () => {
      const date = root.querySelector('#fuDate').value || todayStr();
      const nextDate = root.querySelector('#fuNext').value || '';
      const note = root.querySelector('#fuNote').value.trim();
      if (!note) { showToast('Note likhein'); return; }
      addFollowup(cust, date, note, nextDate);
      renderModal(computeEnriched());
      showToast('Follow-up saved');
    });
    backdrop.onclick = (ev) => { if (ev.target === backdrop) closeModal(); };
    return;
  }
}

// ============================================================
// INIT
// ============================================================
(async function init() {
  await loadAll();
  render();
  const enriched = computeEnriched();
  const todayCount = followupTasks(enriched).filter(t => t.nextDate === todayStr()).length;
  if (todayCount > 0) {
    setTimeout(() => showToast(`Aaj aapke ${todayCount} follow-up task${todayCount > 1 ? 's' : ''} hain — Follow-ups tab check karo`), 600);
  }
})();

</script>
